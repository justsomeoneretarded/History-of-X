name: Study privately supplied video references
on:
  workflow_dispatch:
    inputs:
      transfer_ref:
        description: Temporary branch containing only encrypted reference bundle
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: history-gemini
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_TEXT_REQUEST_BUDGET: '8'
      GEMINI_MEDIA_LEDGER: work/reference-api/usage.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Generate an ephemeral private transfer key on this runner
        run: |
          mkdir -p work/private-references work/public-transfer
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out work/private-references/private.pem 2>/dev/null
          chmod 600 work/private-references/private.pem
          openssl pkey -in work/private-references/private.pem -pubout -out work/public-transfer/public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: reference-transfer-public-key
          path: work/public-transfer/public.pem
          retention-days: 1
      - name: Wait for encrypted reference transfer
        env:
          TRANSFER_REF: ${{ inputs.transfer_ref }}
        run: |
          [[ "$TRANSFER_REF" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]+$ ]] || exit 1
          for attempt in $(seq 1 60); do
            if git fetch origin "refs/heads/$TRANSFER_REF"; then
              git show FETCH_HEAD:transfer/references.tar.enc > work/private-references/references.tar.enc
              git show FETCH_HEAD:transfer/bundle-key.enc > work/private-references/bundle-key.enc
              break
            fi
            sleep 15
          done
          test -s work/private-references/bundle-key.enc
          openssl pkeyutl -decrypt -inkey work/private-references/private.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in work/private-references/bundle-key.enc -out work/private-references/bundle.key
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in work/private-references/references.tar.enc -out work/private-references/references.tar -pass file:work/private-references/bundle.key
          tar -xf work/private-references/references.tar -C work/private-references
          rm work/private-references/references.tar work/private-references/references.tar.enc work/private-references/bundle.key work/private-references/bundle-key.enc work/private-references/private.pem
      - name: Gemini watches and hears supplied videos
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
        run: python -m history_of_x.reference_study --references work/private-references
      - name: Remove private media
        if: always()
        run: rm -rf work/private-references work/reference-api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-study
          path: output/reference-study/
          retention-days: 14
