name: Study privately supplied video references
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Temporary release containing encrypted reference bundle
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: history-gemini
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_TEXT_REQUEST_BUDGET: '8'
      GEMINI_MEDIA_LEDGER: work/reference-api/usage.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Download encrypted references
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p work/private-references
          gh release download "$RELEASE_TAG" --pattern references.tar.enc --dir work/private-references
      - name: Decrypt privately on the runner
        env:
          REFERENCE_BUNDLE_KEY: ${{ secrets.REFERENCE_BUNDLE_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in work/private-references/references.tar.enc -out work/private-references/references.tar -pass env:REFERENCE_BUNDLE_KEY
          tar -xf work/private-references/references.tar -C work/private-references
          rm work/private-references/references.tar work/private-references/references.tar.enc
      - name: Gemini watches and hears supplied videos
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
        run: python -m history_of_x.reference_study --references work/private-references
      - name: Remove private media
        if: always()
        run: rm -rf work/private-references work/reference-api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-study
          path: output/reference-study/
          retention-days: 14
