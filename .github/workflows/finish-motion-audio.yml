name: Finish moving film audio
on:
  workflow_dispatch:
    inputs:
      production_run_id:
        description: Completed moving-film run to finish without re-rendering its picture
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/bootstrap_media.py
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: moving-film
          path: work/source-film
          run-id: ${{ inputs.production_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: animated-checkpoint
          path: work/animated
          run-id: ${{ inputs.production_run_id }}
          github-token: ${{ github.token }}
      - name: Verify narration splice and preserve original moving picture bitstream
        run: python scripts/finish_moving_audio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moving-film-final
          path: output/moving-film/
          retention-days: 14
