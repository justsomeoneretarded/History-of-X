name: Recreate as moving documentary
on:
  workflow_dispatch:
    inputs:
      production_run_id:
        description: Saved narration to preserve while recreating the visuals
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: history-gemini
  cancel-in-progress: false
jobs:
  recreate:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: '1'
      GEMINI_MEDIA_LEDGER: work/media-ledger/usage.json
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_TEXT_REQUEST_BUDGET: ${{ vars.GEMINI_MOTION_REQUEST_BUDGET || '48' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/bootstrap_media.py
      - run: python -m pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: work/media-ledger
          key: media-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: media-ledger-v1-
      - uses: actions/download-artifact@v4
        with:
          name: animated-checkpoint
          path: work/animated
          run-id: ${{ inputs.production_run_id }}
          github-token: ${{ github.token }}
      - name: Gemini physical choreography, preserving existing narration
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
        run: python -m history_of_x.motion_rebuild --stage plan
      - name: Render moving preview and have Gemini watch the video
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
        run: python -m history_of_x.motion_rebuild --stage preview
      - name: Moving preview for inspection
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-preview
          path: output/motion-preview/
          retention-days: 14
      - name: Full moving film after preview motion checks pass
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
        run: python -m history_of_x.motion_rebuild --stage full
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: work/media-ledger
          key: media-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moving-film
          path: output/moving-film/
          retention-days: 14
      - name: Preserve completed motion plans and accepted narration
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animated-checkpoint
          path: |
            work/animated/request.json
            work/animated/script.json
            work/animated/research.json
            work/animated/storyboard.json
            work/animated/motion-storyboard.json
            work/animated/motion-plans
            work/animated/preview-accepted.json
            work/animated/packaging.json
            work/animated/speech
            work/animated/gemini
          retention-days: 14
