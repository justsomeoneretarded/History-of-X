name: Test documentary runner
on:
  push:
    paths: ['history_of_x/**', 'tests/**', 'pyproject.toml', '.github/workflows/**', 'scripts/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python scripts/bootstrap_media.py
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q history_of_x
      - run: pytest -q
      - name: Validate workflows
        run: |
          curl -fLsS https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tgz"
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Render the original acting capability sample
        if: contains(github.event.head_commit.message, '[rig-demo]')
        run: python scripts/rig_demo.py
      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[rig-demo]')
        with:
          name: original-rig-motion-demo
          path: output/rig-demo
          retention-days: 90
      - name: Measure actual frame rendering on the Actions CPU
        if: contains(github.event.head_commit.message, '[rig-benchmark]')
        run: python scripts/profile_rig.py
      - name: Compare a compiled compositor with the reference and render its motion
        if: contains(github.event.head_commit.message, '[cairo-benchmark]')
        run: python scripts/benchmark_compositor.py
      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[cairo-benchmark]')
        with:
          name: original-rig-cairo-demo
          path: output/rig-demo
          retention-days: 90
