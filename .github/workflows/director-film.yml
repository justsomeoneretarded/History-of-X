name: Create a complete history video
on:
  workflow_dispatch:
    inputs:
      title:
        description: Video topic or working title
        type: string
        default: The Entire History of Ethiopia
        required: true
      brief:
        description: Short brief, angle and historical endpoint
        type: string
        default: Connect ancient Aksum, medieval kingdoms, Menelik and Taytu, Adwa, Italian occupation, restoration, revolution and the November 2022 Pretoria agreement through the struggle over who holds power.
        required: true
      voice:
        description: Gemini narrator; auto compares Puck and Charon
        type: choice
        options: [Charon, Puck, Kore, Fenrir, Orus, Aoede, auto]
        default: Charon
      minutes:
        description: Target duration; Jerusalem reference is about 8.75 minutes
        type: string
        default: '8.75'
      mode:
        description: Film runs creative preflight and complete production
        type: choice
        options: [film, proof]
        default: film
      resume_run:
        description: Optional prior run ID containing directed-checkpoint
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: history-gemini
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_XET: '1'
      HF_HOME: ${{ github.workspace }}/work/models/huggingface
      VIDEO_TITLE: ${{ inputs.title }}
      VIDEO_BRIEF: ${{ inputs.brief }}
      VIDEO_MINUTES: ${{ inputs.minutes }}
      NARRATOR: ${{ inputs.voice }}
      FILM_MODE: ${{ inputs.mode }}
      GEMINI_WRITER_MODEL: ${{ vars.GEMINI_WRITER_MODEL || 'gemini-3.1-flash-lite' }}
      GEMINI_DIRECTOR_MODEL: ${{ vars.GEMINI_DIRECTOR_MODEL || 'gemini-3.1-flash-lite' }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
      GEMINI_MEDIA_LEDGER: work/media-ledger/usage.json
      GEMINI_TEXT_REQUEST_BUDGET: '64'
      GEMINI_TTS_REQUEST_BUDGET: '16'
      GEMINI_INPUT_TOKEN_BUDGET: '40000'
      GEMINI_SCENE_BATCH_SIZE: ${{ vars.GEMINI_SCENE_BATCH_SIZE || '1' }}
      SCRIPT_TARGET_WPM: ${{ vars.SCRIPT_TARGET_WPM || '160' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python scripts/bootstrap_media.py
      - run: python -m pip install -e '.[alignment,test]'
      - name: Verify code before spending provider quota
        run: |
          python -m compileall -q history_of_x scripts
          env -u GEMINI_MEDIA_LEDGER -u GEMINI_TEXT_REQUEST_BUDGET -u GEMINI_TTS_REQUEST_BUDGET -u GEMINI_INPUT_TOKEN_BUDGET pytest -q
      - uses: actions/cache@v4
        with:
          path: work/models
          key: whisper-base-en-v1-${{ runner.os }}
      - uses: actions/cache/restore@v4
        with:
          path: work/media-ledger
          key: media-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: media-ledger-v1-
      - uses: actions/download-artifact@v4
        if: ${{ inputs.resume_run != '' }}
        with:
          name: directed-checkpoint
          path: work/director
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
      - name: Write the original complete script
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
          GEMINI_MODEL: ${{ env.GEMINI_WRITER_MODEL }}
          GEMINI_SCHEMA_MODE: prompt
          GEMINI_AUDIO_REVIEW_MODEL: gemini-3.5-flash-lite
        run: python -m history_of_x.director_script --stage plan
      - name: Audition Gemini voices when requested
        if: ${{ env.NARRATOR == 'auto' }}
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
          GEMINI_MODEL: ${{ env.GEMINI_WRITER_MODEL }}
          GEMINI_SCHEMA_MODE: prompt
          GEMINI_AUDIO_REVIEW_MODEL: gemini-3.5-flash-lite
        run: python -m history_of_x.director_script --stage audition
      - name: Generate and verify Gemini narration
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
          GEMINI_MODEL: ${{ env.GEMINI_WRITER_MODEL }}
          GEMINI_SCHEMA_MODE: prompt
          GEMINI_AUDIO_REVIEW_MODEL: gemini-3.5-flash-lite
        run: python -m history_of_x.director_script --stage voice
      - name: Preserve narration before visual production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-audio
          path: |
            work/director/*.json
            work/director/*.txt
            work/director/director-chapters
            work/director/speech
            work/director/voice-auditions
            work/director/gemini
          retention-days: 90
      - name: Direct, render and review the complete film
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
          GEMINI_SCHEMA_MODE: prompt
          GEMINI_DIRECTOR_POSITIVE_EXAMPLE: '1'
          GEMINI_AUDIO_REVIEW_MODEL: gemini-3.5-flash-lite
          GEMINI_PACKAGE_MODEL: gemini-3.5-flash-lite
          GEMINI_REVIEW_MODEL: gemini-3.5-flash-lite
          GEMINI_REVIEW_CACHE: work/director/editorial-review-parts
        run: |
          if [[ "$FILM_MODE" == "proof" ]]; then
            python -m history_of_x.director_runner --proof-only
          else
            python -m history_of_x.director_runner
          fi
      - name: Publish inspectable frame evidence
        if: always()
        run: python scripts/production_request.py evidence
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: work/media-ledger
          key: media-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directed-checkpoint
          path: |
            work/director/*.json
            work/director/*.txt
            work/director/director-chapters
            work/director/story-checks
            work/director/gemini
            work/director/speech
            work/director/voice-auditions
            work/director/media
            work/director/scene-programs
            work/director/directed-render
            work/director/editorial-review-parts
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-candidates
          path: |
            output/director/candidates
            output/director/failure.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: ${{ success() && inputs.mode != 'proof' }}
        with:
          name: youtube-upload-ready
          path: output/director/upload-ready
          if-no-files-found: error
          retention-days: 90
