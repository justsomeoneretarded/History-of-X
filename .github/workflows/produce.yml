name: Produce documentary
on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        type: string
      brief:
        description: Small brief, historical scope and angle
        required: true
        type: string
      voice:
        description: Narrator
        type: choice
        options: [warguy, kit-laser]
        default: warguy
      minutes:
        description: Target minutes (1–60); CPU generation can take hours
        type: string
        default: '8'
      profile:
        description: Render quality
        type: choice
        options: [cinematic, standard, draft]
        default: cinematic
      preset:
        description: auto uses Gemini; ethiopia uses the curated source-linked episode
        type: choice
        options: [auto, ethiopia]
        default: auto
      resume_run:
        description: Optional previous run ID to recover checkpoints
        type: string
        default: ''
  push:
    paths: ['episodes/requests/*.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: documentary-production
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_XET: '1'
  HF_HOME: ${{ github.workspace }}/work/models/huggingface
  TORCH_HOME: ${{ github.workspace }}/work/models/torch
  XDG_CACHE_HOME: ${{ github.workspace }}/work/cache
  TTS_MODEL: original
  TTS_THREADS: '2'
  VOICE_TAKES: '1'
  WHISPER_MODEL: base.en
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      request_id: ${{ steps.request.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Prepare request safely
        id: request
        env:
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_BRIEF: ${{ inputs.brief }}
          NARRATOR: ${{ inputs.voice }}
          VIDEO_MINUTES: ${{ inputs.minutes }}
          VIDEO_PROFILE: ${{ inputs.profile }}
          PRESET: ${{ inputs.preset }}
        run: python scripts/actions_request.py
      - name: Restore completed work for identical inputs
        uses: actions/cache/restore@v4
        with:
          path: work/job
          key: episode-v1-${{ steps.request.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: episode-v1-${{ steps.request.outputs.id }}-
      - name: Recover requested plan checkpoint
        if: ${{ inputs.resume_run != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: checkpoint-plan
          path: work/job
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
      - name: Recover requested speech checkpoint
        if: ${{ inputs.resume_run != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: checkpoint-voice
          path: work/job
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
      - name: Research, script, editorial revision and licensed visuals
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          CONFIRMED_FREE_MODEL: ${{ vars.CONFIRMED_FREE_MODEL }}
          GEMINI_REQUEST_BUDGET: ${{ vars.GEMINI_REQUEST_BUDGET || '12' }}
          GEMINI_INPUT_TOKEN_BUDGET: ${{ vars.GEMINI_INPUT_TOKEN_BUDGET || '12000' }}
        run: python -m history_of_x.cli --request work/request.json --stage plan
      - name: Save plan and request for downstream jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-plan
          path: work/job/
          if-no-files-found: warn
          retention-days: 14
      - name: Save request
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-request
          path: work/request.json
          retention-days: 14
      - name: Save resumable state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/job
          key: episode-v1-${{ steps.request.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}-plan
  voice:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: production-request
          path: work
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-plan
          path: work/job
      - uses: actions/cache@v4
        with:
          path: |
            work/models
            work/cache
          key: chatterbox-original-cpu-v1-${{ runner.os }}
      - run: bash scripts/install_voice.sh
      - name: Generate and verify selected narration
        run: python -m history_of_x.cli --request work/request.json --stage voice
      - name: Save accepted speech even when a later chunk fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-voice
          path: work/job/
          retention-days: 14
      - name: Save resumable episode state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/job
          key: episode-v1-${{ needs.plan.outputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}-voice
  render:
    needs: voice
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: production-request
          path: work
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-voice
          path: work/job
      - name: Edit, mix, caption, package and verify final film
        run: python -m history_of_x.cli --request work/request.json --stage render
      - name: Final video and upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-final
          path: output/
          if-no-files-found: error
          retention-days: 14
      - name: Publish quality summary
        if: always()
        run: python scripts/actions_summary.py
