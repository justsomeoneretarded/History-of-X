name: Produce animated history video
on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title or topic
        required: true
        type: string
      brief:
        description: Small brief, scope and angle
        required: true
        type: string
      voice:
        description: Gemini voice (these are not Chatterbox reference voices)
        type: choice
        options: [Puck, Charon, Kore, Fenrir, Orus, Aoede]
        default: Puck
      minutes:
        description: Target narration minutes (0.5–10)
        type: string
        default: '8'
      profile:
        description: Render resolution
        type: choice
        options: [cinematic, standard, draft]
        default: cinematic
      preset:
        description: auto researches your topic; ethiopia reuses reviewed evidence but writes a NEW script
        type: choice
        options: [auto, ethiopia]
        default: auto
      resume_run:
        description: Previous animated run ID for identical inputs
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: history-gemini
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_XET: '1'
      HF_HOME: ${{ github.workspace }}/work/models/huggingface
      VIDEO_TITLE: ${{ inputs.title }}
      VIDEO_BRIEF: ${{ inputs.brief }}
      NARRATOR: ${{ inputs.voice }}
      VIDEO_MINUTES: ${{ inputs.minutes }}
      VIDEO_PROFILE: ${{ inputs.profile }}
      PRESET: ${{ inputs.preset }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
      GEMINI_MEDIA_LEDGER: work/media-ledger/usage.json
      GEMINI_TEXT_REQUEST_BUDGET: ${{ vars.GEMINI_TEXT_REQUEST_BUDGET || '24' }}
      GEMINI_TTS_REQUEST_BUDGET: ${{ vars.GEMINI_TTS_REQUEST_BUDGET || '16' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python scripts/bootstrap_media.py
      - run: python -m pip install -e '.[alignment]'
      - uses: actions/cache@v4
        with:
          path: work/models
          key: whisper-base-en-v1-${{ runner.os }}
      - uses: actions/cache/restore@v4
        with:
          path: work/media-ledger
          key: media-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: media-ledger-v1-
      - name: Recover saved production
        if: ${{ inputs.resume_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: animated-checkpoint
          path: work/animated
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
      - name: Gemini research and original script
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
        run: python -m history_of_x.animated --stage plan
      - name: Gemini narration and local speech verification
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
        run: python -m history_of_x.animated --stage voice
      - name: Gemini speech-timed storyboard
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
        run: python -m history_of_x.animated --stage direct
      - name: Animate, mix, package and review
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
        run: python -m history_of_x.animated --stage render
      - name: Save quota ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/media-ledger
          key: media-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save resumable production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animated-checkpoint
          path: |
            work/animated/request.json
            work/animated/research.json
            work/animated/script.json
            work/animated/storyboard.json
            work/animated/packaging.json
            work/animated/boards
            work/animated/speech
            work/animated/gemini
          retention-days: 14
      - name: Downloadable video and YouTube upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animated-video
          path: output/
          retention-days: 14
