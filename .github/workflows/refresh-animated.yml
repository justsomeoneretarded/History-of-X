name: Refine saved animated video
on:
  workflow_dispatch:
    inputs:
      production_run_id:
        description: Completed animated run containing accepted narration and storyboard
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: history-gemini
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      GEMINI_MEDIA_LEDGER: work/media-ledger/usage.json
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_TEXT_REQUEST_BUDGET: ${{ vars.GEMINI_TEXT_REQUEST_BUDGET || '28' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/bootstrap_media.py
      - run: python -m pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: work/media-ledger
          key: media-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: media-ledger-v1-
      - uses: actions/download-artifact@v4
        with:
          name: animated-checkpoint
          path: work/animated
          run-id: ${{ inputs.production_run_id }}
          github-token: ${{ github.token }}
      - name: Render current art, mix, caption and review
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
        run: python scripts/render_animated_saved.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: work/media-ledger
          key: media-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save refined checkpoint for further edits
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animated-checkpoint
          path: |
            work/animated/request.json
            work/animated/research.json
            work/animated/script.json
            work/animated/storyboard.json
            work/animated/packaging.json
            work/animated/boards
            work/animated/speech
            work/animated/gemini
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animated-video
          path: output/
          retention-days: 14
