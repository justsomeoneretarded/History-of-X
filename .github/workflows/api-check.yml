name: Check free Gemini models
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: history-gemini
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Probe free text candidates with tiny requests
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
        run: python scripts/check_free_models.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-model-check
          path: output/free-model-check.json
          retention-days: 7
