name: Compare production renders
on:
  workflow_dispatch:
    inputs:
      production_run_id:
        description: Successful production run ID containing chapter narration checkpoints
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: if ! command -v ffmpeg >/dev/null; then timeout 180 sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: production-request
          path: work
          run-id: ${{ inputs.production_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-plan
          path: work/job
          run-id: ${{ inputs.production_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: checkpoint-voice-*
          path: work/recovered-voices
          run-id: ${{ inputs.production_run_id }}
          github-token: ${{ github.token }}
      - name: Render identical material in three profiles and measure it
        run: python scripts/compare_renders.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-comparisons
          path: output/comparison/
          retention-days: 14
