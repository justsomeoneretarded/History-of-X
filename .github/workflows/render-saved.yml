name: Render saved production
on:
  workflow_dispatch:
    inputs:
      production_run_id:
        description: Run ID with all five verified narration chapter artifacts
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python scripts/bootstrap_media.py
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: production-request
          path: work
          run-id: ${{ inputs.production_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-plan
          path: work/job
          run-id: ${{ inputs.production_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: checkpoint-voice-*
          path: work/recovered-voices
          run-id: ${{ inputs.production_run_id }}
          github-token: ${{ github.token }}
      - name: Reuse accepted narration
        run: python -c "from history_of_x.speech_merge import recover; recover('work/recovered-voices','work/job/speech')"
      - name: Refresh visual selection and original graphics
        run: python -m history_of_x.cli --request work/request.json --stage plan
      - name: Render and verify final video
        run: python -m history_of_x.cli --request work/request.json --stage render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentary-final
          path: output/
          retention-days: 14
      - if: always()
        run: python scripts/actions_summary.py
