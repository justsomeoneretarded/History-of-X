name: Inspect saved director checkpoint
on:
  push:
    branches: [main]
    paths: ['production/inspections/latest.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select existing checkpoint
        run: |
          python - <<'PY'
          import json, os, re
          request=json.load(open('production/inspections/latest.json'))
          run=str(request['run_id'])
          artifact=request.get('artifact','directed-checkpoint')
          if artifact not in {'directed-checkpoint','director-audio'}: raise ValueError('Unsupported checkpoint artifact')
          if not re.fullmatch(r'[0-9]+',run): raise ValueError('Numeric run ID required')
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('CHECKPOINT_RUN='+run+'\nCHECKPOINT_ARTIFACT='+artifact+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CHECKPOINT_ARTIFACT }}
          run-id: ${{ env.CHECKPOINT_RUN }}
          path: work/director
          github-token: ${{ github.token }}
      - run: python -m pip install -e .
      - name: Inspect saved scene programs without provider requests
        run: python scripts/inspect_director_checkpoint.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: director-inspection
          path: output/inspection
          retention-days: 90
